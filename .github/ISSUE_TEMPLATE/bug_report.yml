name: Bug report
description: Report a reproducible problem in Sypra.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Sypra version or commit
      placeholder: v0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example. Redact prompts, files, paths, and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
      description: Remove API keys, tokens, private URLs, and user data.
    validations:
      required: true
